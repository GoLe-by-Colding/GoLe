name: gole

services:
  mongo:
    image: mongo:7
    container_name: gole-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            const cfg = rs.conf();
            if (cfg.members[0].host !== "mongo:27017") {
              cfg.version += 1;
              cfg.members[0].host = "mongo:27017";
              rs.reconfig(cfg, {force:true});
            }
          } catch (e) {
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]});
          }
        '

  redis:
    image: redis:7-alpine
    container_name: gole-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: gole-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ["${GOLE_INFRA_ENV_FILE:-/etc/gole/infra.env}"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    env_file: ["${GOLE_INFRA_ENV_FILE:-/etc/gole/infra.env}"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/gole

  backend:
    build:
      context: ../..
      dockerfile: infra/gcp/docker/api.Dockerfile
    image: gole/backend:local
    container_name: gole-backend
    restart: unless-stopped
    env_file: ["${GOLE_APP_ENV_FILE:-/etc/gole/gole.env}"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/gole?replicaSet=rs0
      REDIS_HOST: redis
      STORAGE_S3_ENDPOINT: http://minio:9000
      GOLE_ENVIRONMENT: ${GOLE_ENVIRONMENT:-staging}
      GOLE_CATALOG_SEED: ${GOLE_CATALOG_SEED:-false}
      GOLE_LISTING_SEED: ${GOLE_LISTING_SEED:-false}
      GOLE_PRICING_SEED: ${GOLE_PRICING_SEED:-false}
      GOLE_PRICING_INCLUDE_DEMO: ${GOLE_PRICING_INCLUDE_DEMO:-false}
      GOLE_PRICING_INCLUDE_LEGACY: ${GOLE_PRICING_INCLUDE_LEGACY:-false}
      GOLE_COMMUNITY_SEED: ${GOLE_COMMUNITY_SEED:-false}
      GOLE_REPORT_SEED: ${GOLE_REPORT_SEED:-false}
      GOLE_REVIEW_SEED: ${GOLE_REVIEW_SEED:-false}
      GOLE_MEDIA_SEED: ${GOLE_MEDIA_SEED:-false}
      GOLE_DISCORD_ALERTS_ENABLED: ${GOLE_DISCORD_ALERTS_ENABLED:-false}
      DISCORD_DEPLOY_WEBHOOK_URL: ${DISCORD_DEPLOY_WEBHOOK_URL:-}
      DISCORD_OPERATIONS_WEBHOOK_URL: ${DISCORD_OPERATIONS_WEBHOOK_URL:-}
      DISCORD_ACCOUNT_WEBHOOK_URL: ${DISCORD_ACCOUNT_WEBHOOK_URL:-}
      DISCORD_PAYMENT_WEBHOOK_URL: ${DISCORD_PAYMENT_WEBHOOK_URL:-}
      DISCORD_SUPPRESS_NOTIFICATIONS: ${DISCORD_SUPPRESS_NOTIFICATIONS:-true}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  budget-relay:
    build:
      context: ./budget-relay
      dockerfile: Dockerfile
    image: gole/budget-relay:local
    container_name: gole-budget-relay
    restart: unless-stopped
    environment:
      GCP_BUDGET_PUBSUB_SUBSCRIPTION: ${GCP_BUDGET_PUBSUB_SUBSCRIPTION:-gole-billing-budget-discord}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-project-72a52bf1-06aa-4519-b2c}
      GCP_CREDIT_AMOUNT_KRW: ${GCP_CREDIT_AMOUNT_KRW:-395600.60}
      GCP_CREDIT_DEADLINE: ${GCP_CREDIT_DEADLINE:-2026-10-28}
      GCP_FIXED_HOURLY_COST_KRW: ${GCP_FIXED_HOURLY_COST_KRW:-231.249894200}
      GCP_BUDGET_WARNING_THRESHOLDS: ${GCP_BUDGET_WARNING_THRESHOLDS:-0.50,0.75,0.85,0.90,0.95,1.00}
      GCP_HARD_STOP_ENABLED: ${GCP_HARD_STOP_ENABLED:-false}
      GCP_HARD_STOP_DRY_RUN: ${GCP_HARD_STOP_DRY_RUN:-false}
      GCP_HARD_STOP_BILLING_COST_KRW: ${GCP_HARD_STOP_BILLING_COST_KRW:-320000}
      GCP_HARD_STOP_MIN_RESERVE_KRW: ${GCP_HARD_STOP_MIN_RESERVE_KRW:-75000}
      GCP_HARD_STOP_ALL_IN_COST_KRW: ${GCP_HARD_STOP_ALL_IN_COST_KRW:-350000}
      GCP_COST_GUARD_WARNING_KRW: ${GCP_COST_GUARD_WARNING_KRW:-330000}
      GCP_COST_GUARD_DANGER_KRW: ${GCP_COST_GUARD_DANGER_KRW:-340000}
      GCP_HARD_STOP_NETWORK_GIB: ${GCP_HARD_STOP_NETWORK_GIB:-30}
      GCP_COST_GUARD_NETWORK_WARNING_GIB: ${GCP_COST_GUARD_NETWORK_WARNING_GIB:-15}
      GCP_COST_GUARD_NETWORK_DANGER_GIB: ${GCP_COST_GUARD_NETWORK_DANGER_GIB:-25}
      GCP_HARD_STOP_MAX_RUNTIME_HOURS: ${GCP_HARD_STOP_MAX_RUNTIME_HOURS:-1320}
      GCP_COST_GUARD_RUNTIME_WARNING_HOURS: ${GCP_COST_GUARD_RUNTIME_WARNING_HOURS:-1200}
      GCP_COST_GUARD_RUNTIME_DANGER_HOURS: ${GCP_COST_GUARD_RUNTIME_DANGER_HOURS:-1296}
      GCP_HARD_STOP_EXPECTED_BUDGET_KRW: ${GCP_HARD_STOP_EXPECTED_BUDGET_KRW:-370000}
      GCP_HARD_STOP_BUDGET_ID: ${GCP_HARD_STOP_BUDGET_ID:-}
      GCP_HARD_STOP_BILLING_ACCOUNT_ID: ${GCP_HARD_STOP_BILLING_ACCOUNT_ID:-}
      GCP_HARD_STOP_BUDGET_DISPLAY_NAME: ${GCP_HARD_STOP_BUDGET_DISPLAY_NAME:-GoLe production credit guard}
      GCP_HARD_STOP_PERIOD_START: ${GCP_HARD_STOP_PERIOD_START:-}
      GCP_VM_COST_START: ${GCP_VM_COST_START:-}
      GCP_HARD_STOP_AT: ${GCP_HARD_STOP_AT:-}
      GCP_HARD_STOP_ARM_ID: ${GCP_HARD_STOP_ARM_ID:-}
      GCP_INSTANCE_ZONE: ${GCP_INSTANCE_ZONE:-asia-northeast3-a}
      GCP_INSTANCE_NAME: ${GCP_INSTANCE_NAME:-gole-production}
      GCP_VAT_RATE: ${GCP_VAT_RATE:-0.10}
      GCP_NETWORK_EGRESS_KRW_PER_GIB: ${GCP_NETWORK_EGRESS_KRW_PER_GIB:-318.154399937}
      GCP_STOPPED_RESOURCE_HOURLY_COST_KRW: ${GCP_STOPPED_RESOURCE_HOURLY_COST_KRW:-45.725088879}
      GCP_COST_GUARD_INTERVAL_SECONDS: ${GCP_COST_GUARD_INTERVAL_SECONDS:-10}
      GCP_HARD_STOP_RETRY_SECONDS: ${GCP_HARD_STOP_RETRY_SECONDS:-300}
      BUDGET_HTTP_TIMEOUT_SECONDS: ${BUDGET_HTTP_TIMEOUT_SECONDS:-5}
      DISCORD_OPERATIONS_WEBHOOK_URL: ${DISCORD_OPERATIONS_WEBHOOK_URL:-}
    volumes:
      - budget-relay-state:/state
      - /sys/class/net/ens4/statistics/tx_bytes:/host-metrics/tx_bytes:ro
      - /proc/sys/kernel/random/boot_id:/host-metrics/boot_id:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,time; p='/tmp/gole-cost-guard-heartbeat'; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<35 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../..
      dockerfile: infra/gcp/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://gole.co.kr}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gole.co.kr}
        NEXT_PUBLIC_PAYMENT_MODE: ${NEXT_PUBLIC_PAYMENT_MODE:-portone-test}
        NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY:-}
        NEXT_PUBLIC_PORTONE_CARD_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CARD_CHANNEL_KEY:-}
    image: gole/frontend:local
    container_name: gole-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/icon.svg').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  nginx:
    image: nginx:1.29-alpine
    container_name: gole-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    volumes:
      - /etc/gole/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["certificate"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  mongo-data:
    name: gole_mongo-data
  redis-data:
    name: gole_redis-data
  minio-data:
    name: gole_minio-data
  certbot-webroot:
    name: gole_certbot-webroot
  letsencrypt:
    name: gole_letsencrypt
  budget-relay-state:
    name: gole_budget-relay-state
