services:
  mongo:
    image: mongo:7
    container_name: gole-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # 단일 노드 replica set: 멀티 도큐먼트 트랜잭션(주문/결제/정산 정합성)에 필요.
    # 로컬 개발 단순화를 위해 auth는 비활성. 운영에서는 keyfile + auth 적용 필요.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 단일 노드 replica set 자동 초기화
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status().ok }
          catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}) }
        '

  redis:
    image: redis:7-alpine
    container_name: gole-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 오브젝트 스토리지(S3 호환). media 컨텍스트가 매물/게시글 사진과
  # 시드 커버 아트를 여기에 올린다. 이게 없으면 MediaSeeder가 전부 실패하고
  # 로컬은 이미지가 깨진 채로 뜬다.
  minio:
    image: minio/minio:latest
    container_name: gole-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 웹 콘솔 (http://localhost:9001, minioadmin/minioadmin)
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # `gole` 버킷 생성 + 익명 읽기 허용(멱등).
  # 애플리케이션도 ensureBucket()으로 버킷을 만들지만, 인프라만 띄운 상태에서
  # 콘솔로 확인하거나 mc로 다룰 수 있도록 여기서 미리 준비한다.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 \
          "${STORAGE_S3_ACCESS_KEY:-minioadmin}" "${STORAGE_S3_SECRET_KEY:-minioadmin}"
        mc mb --ignore-existing local/${STORAGE_S3_BUCKET:-gole}
        mc anonymous set download local/${STORAGE_S3_BUCKET:-gole}

volumes:
  mongo_data:
  redis_data:
  minio_data:
