services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:${MONGODB_PORT:-27017}"
    # 단일 노드 replica set: 멀티 도큐먼트 트랜잭션(주문/결제/정산 정합성)에 필요.
    # 로컬 개발 단순화를 위해 auth는 비활성. 운영에서는 keyfile + auth 적용 필요.
    command: ["--port", "${MONGODB_PORT:-27017}", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--port",
          "${MONGODB_PORT:-27017}",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 단일 노드 replica set 자동 초기화
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:${MONGODB_PORT:-27017} --quiet --eval '
          try { rs.status().ok }
          catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:${MONGODB_PORT:-27017}"}]}) }
        '

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 오브젝트 스토리지(S3 호환). media 컨텍스트가 매물/게시글 사진과
  # 시드 커버 아트를 여기에 올린다. 이게 없으면 MediaSeeder가 전부 실패하고
  # 로컬은 이미지가 깨진 채로 뜬다.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # 웹 콘솔
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # `gole` 버킷 생성 + 기존 익명 정책 제거(멱등).
  # 애플리케이션도 ensureBucket()으로 버킷을 만들지만, 인프라만 띄운 상태에서
  # 콘솔로 확인하거나 mc로 다룰 수 있도록 여기서 미리 준비한다. 사용자 미디어는
  # 반드시 백엔드 접근 원장을 통과해야 하므로 버킷 직접 공개를 금지한다.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 \
          "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"
        mc mb --ignore-existing local/${STORAGE_S3_BUCKET:-gole}
        mc anonymous set none local/${STORAGE_S3_BUCKET:-gole}

  # 필요할 때만 `docker compose --profile support-agent up -d support-agent`로 띄운다.
  # 기본 infra:up에는 포함하지 않아 가벼운 Mac 개발 환경을 유지한다.
  support-agent:
    profiles: ["support-agent"]
    build:
      context: .
      dockerfile: apps/support-agent/Dockerfile
    ports:
      - "127.0.0.1:${SUPPORT_AGENT_GRPC_PORT:-50051}:50051"
    environment:
      SUPPORT_AGENT_GRPC_PORT: "50051"
      SUPPORT_AGENT_WORKERS: ${SUPPORT_AGENT_WORKERS:-2}
      LOG_LEVEL: ${SUPPORT_AGENT_LOG_LEVEL:-INFO}

volumes:
  mongo_data:
  redis_data:
  minio_data:
