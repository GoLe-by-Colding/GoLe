version: 2
updates:
  # 프론트엔드(pnpm workspace) — apps/web · packages/*
  - package-ecosystem: npm
    directory: "/"
    # 모든 PR 은 dev 로 간다. main 으로 가는 길은 dev -> main 릴리스 하나뿐이다.
    target-branch: dev
    labels: ["의존성", "프론트"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # 모바일은 dependabot 이 올리지 않는다. Expo SDK 가 react · react-native · expo-* · RN 네이티브
    # 라이브러리의 버전을 `expo/bundledNativeModules.json` 에 정확히 고정하는데, dependabot 은 그 표를 모른다.
    # 실제로 2026-10-09 에 web 묶음(#188)이 apps/mobile 의 react 를 19.3 으로, reanimated·worklets 를
    # 아직 베타(`next` 태그)인 SDK 58 쪽 버전으로 끌고 왔고, expo-* 는 모듈 하나씩 58 로 올리는 PR(#189~#192)이
    # 왔다. RN 렌더러는 react 와 버전이 정확히 같아야 해서 이대로 받으면 앱이 기동하다 죽는데, 모바일 CI 는
    # typecheck·lint 만 봐서 초록으로 보인다.
    # 모바일은 `cd apps/mobile && npx expo install --check`(SDK 안 패치) 와 SDK 업그레이드
    # (`npx expo install expo@^<N> --fix`)로만 올린다.
    # 주의: dependabot 은 이 파일을 기본 브랜치(main)에서 읽는다. dev 에만 있으면 아직 적용되지 않는다.
    exclude-paths:
      - "apps/mobile/**"
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    # 메이저를 막아 두는 것들. 열려 있어도 머지할 수 없어서 PR 목록만 채우던 것들이다.
    # 막은 조건이 풀리면 이 줄을 지우고 올린다 — "언젠가"가 아니라 아래 조건으로 판단한다.
    ignore:
      # 런타임을 Node 22 LTS 로 고정한다(.nvmrc · engines · ci.yml 4곳).
      # @types/node 메이저는 Node 메이저를 따라가므로, 올리면 Node 22 에 없는 API 가
      # 타입검사를 통과한다. Node 를 올릴 때 같이 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 10 은 eslint-plugin-react 가 아직 지원하지 않는다. 지원되면 푼다.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 은 @typescript-eslint 가 아직 지원하지 않는다. 지원되면 푼다.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # (2026-10-09 지움) react-native 0.87.x 차단. metro 0.87.0 이 끌고 오던 image-size 의 high 2건
      # (GHSA-w3rx-r6r6-pgpr · GHSA-5p2g-fcmc-qvqq)이 image-size 2.0.3 에서 패치됐고, metro 0.87.1 부터는
      # image-size 를 아예 쓰지 않는다. 게다가 모바일이 위 exclude-paths 로 빠져 이 규칙이 걸릴 곳이 없다.
      # RN 은 SDK 업그레이드 때 `pnpm audit --audit-level high` 로 다시 확인한다.

  # 백엔드(Gradle)
  - package-ecosystem: gradle
    directory: "/apps/api"
    target-branch: dev
    labels: ["의존성", "백엔드"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      api-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    labels: ["의존성", "CI"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # 액션은 한 PR 로 묶는다. 개별로 오면 CI 를 액션 수만큼 돌려야 하고, 실제로 그래서
    # 2026-09-10 에 5종을 손으로 #94 하나에 합쳤다. 메이저까지 포함하는 이유는 액션
    # 메이저가 대개 러너/Node 런타임 교체라 개별로 나눌 실익이 없기 때문이다.
    groups:
      ci-actions:
        update-types: [major, minor, patch]
