version: 2
updates:
  # 프론트엔드(pnpm workspace)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    # 메이저를 막아 두는 것들. 열려 있어도 머지할 수 없어서 PR 목록만 채우던 것들이다.
    # 막은 조건이 풀리면 이 줄을 지우고 올린다 — "언젠가"가 아니라 아래 조건으로 판단한다.
    ignore:
      # 런타임을 Node 22 LTS 로 고정한다(.nvmrc · engines · ci.yml 4곳).
      # @types/node 메이저는 Node 메이저를 따라가므로, 올리면 Node 22 에 없는 API 가
      # 타입검사를 통과한다. Node 를 올릴 때 같이 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 10 은 eslint-plugin-react 가 아직 지원하지 않는다. 지원되면 푼다.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 은 @typescript-eslint 가 아직 지원하지 않는다. 지원되면 푼다.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # 백엔드(Gradle)
  - package-ecosystem: gradle
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      api-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
