version: 2
updates:
  # 프론트엔드(pnpm workspace)
  - package-ecosystem: npm
    directory: "/"
    # 모든 PR 은 dev 로 간다. main 으로 가는 길은 dev -> main 릴리스 하나뿐이다.
    target-branch: dev
    labels: ["의존성", "프론트"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    # 메이저를 막아 두는 것들. 열려 있어도 머지할 수 없어서 PR 목록만 채우던 것들이다.
    # 막은 조건이 풀리면 이 줄을 지우고 올린다 — "언젠가"가 아니라 아래 조건으로 판단한다.
    ignore:
      # 런타임을 Node 22 LTS 로 고정한다(.nvmrc · engines · ci.yml 4곳).
      # @types/node 메이저는 Node 메이저를 따라가므로, 올리면 Node 22 에 없는 API 가
      # 타입검사를 통과한다. Node 를 올릴 때 같이 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 10 은 eslint-plugin-react 가 아직 지원하지 않는다. 지원되면 푼다.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 은 @typescript-eslint 가 아직 지원하지 않는다. 지원되면 푼다.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # 백엔드(Gradle)
  - package-ecosystem: gradle
    directory: "/apps/api"
    target-branch: dev
    labels: ["의존성", "백엔드"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      api-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    labels: ["의존성", "CI"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # 액션은 한 PR 로 묶는다. 개별로 오면 CI 를 액션 수만큼 돌려야 하고, 실제로 그래서
    # 2026-09-10 에 5종을 손으로 #94 하나에 합쳤다. 메이저까지 포함하는 이유는 액션
    # 메이저가 대개 러너/Node 런타임 교체라 개별로 나눌 실익이 없기 때문이다.
    groups:
      ci-actions:
        update-types: [major, minor, patch]
