name: Promotion gateway deploy

# 홍보 LLM 게이트웨이 코드 이미지(apps/support-agent/gateway)가 main 에서 바뀌면 GHCR 에 올린다(promotion-review D26·D28).
# 지인 서버의 run.sh 가 요청마다 :stable 을 받아 바뀌었으면 codex 로그인을 얹어 다시 구우므로 서버에 접속하는 배포 단계가 없다.
# 이 이미지에는 로그인이 없다 — 로그인은 서버에서만 얹는다.
# 사람 관문은 main 이다 — main 은 리뷰를 거친 릴리스 PR 로만 바뀐다. 패키지는 공개(public)여야 서버가 로그인 없이 받는다.
on:
  push:
    branches: [main]
    paths:
      - apps/support-agent/gateway/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 홍보 실행(promotion-agent)과 그룹을 나눈다. 같은 그룹이면 대기 칸이 하나라, 배포가 기다리는 사이 다음 홍보 실행이
# 오면 배포가 시작도 못 하고 취소된다(알림도 없다). 진행 중인 초안은 지인 서버 run.sh 의 잠금이 지킨다 — 이미지는
# 요청을 시작할 때 받으므로, 바뀌어도 도는 호출에는 닿지 않는다(promotion-review D28).
concurrency:
  group: promotion-gateway-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Publish gateway image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build, smoke test, push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/gole-llm-gateway"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$GITHUB_SHA" apps/support-agent/gateway
          # 연기 테스트: 잘못된 engine 은 CLI 를 부르지 않고 고정 문장으로 거절되는지 본다. 쓰는 자리(CODEX_HOME·상태 볼륨)만
          # tmpfs 로 열어, 이미지가 그 밖에 쓰려 하면 여기서 깨지게 한다.
          out="$(printf '{"engine":"smoke","prompt":"ping"}' | docker run --rm -i --read-only --tmpfs /tmp \
            --tmpfs /home/gateway/.codex:uid=10010,mode=0700 --tmpfs /home/gateway/state:uid=10010,mode=0700 \
            "$image:$GITHUB_SHA")"
          case "$out" in
            *'"ok": false'*'engine'*) ;;
            *) echo "::error::게이트웨이 이미지 연기 테스트 실패 — stable 은 이전 이미지 그대로다"; exit 1 ;;
          esac
          docker tag "$image:$GITHUB_SHA" "$image:stable"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:stable"
          echo "올린 이미지: $image:$GITHUB_SHA (stable)" >> "$GITHUB_STEP_SUMMARY"

      # 실패하면 stable 은 이전 이미지 그대로다. 사람이 원인을 보게 알린다.
      - name: Notify Discord
        if: failure() || cancelled()
        env:
          DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
          DISCORD_AVATAR_URL: https://gole.co.kr/icon.svg
          DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'false' }}
        run: |
          if [ -z "$DISCORD_OPERATIONS_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_OPERATIONS_WEBHOOK_URL 이 없어 알리지 않았다"
            exit 0
          fi
          flags=null
          if [ "$DISCORD_SUPPRESS_NOTIFICATIONS" = "true" ]; then
            flags=4096
          fi
          payload=$(jq -n \
            --arg content "❌ GoLe 홍보 게이트웨이 이미지 배포 실패 · stable 은 이전 이미지 유지 · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg avatar_url "$DISCORD_AVATAR_URL" \
            --argjson flags "$flags" \
            '{content: $content, avatar_url: $avatar_url, allowed_mentions: {parse: []}}
             + (if $flags == null then {} else {flags: $flags} end)')
          curl -fsS --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_OPERATIONS_WEBHOOK_URL" \
            || echo "::warning::Discord 알림 전송 실패"
