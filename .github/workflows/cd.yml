name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# 운영 컨테이너에서는 한 번에 하나의 배포만 실행한다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP production
    # PR용 CI 완료 이벤트는 배포하지 않고, main push의 성공한 CI만 배포한다.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Linux, X64, gole-gcp-production]
    timeout-minutes: 30
    steps:
      - name: Verify manually selected main SHA passed CI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              "?branch=main&event=push&status=completed&per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              runs = json.load(response).get("workflow_runs", [])
          if not any(
              run.get("head_sha") == sha and run.get("conclusion") == "success"
              for run in runs
          ):
              raise SystemExit("선택한 main SHA의 성공한 CI 실행을 찾지 못했습니다.")
          PY

      # Discord 라우팅 값은 서버 환경파일에 저장하지 않고 배포 시점에만 주입한다.
      # Compose가 이 실행의 환경변수를 backend 컨테이너에 전달한다.
      - name: Deploy latest main
        id: deploy
        env:
          # workflow_run에서 성공한 바로 그 커밋만 배포한다. main이 그사이 갱신돼도
          # 아직 CI를 통과하지 않은 새 커밋을 앞질러 배포하지 않는다.
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
          DISCORD_ACCOUNT_WEBHOOK_URL: ${{ secrets.DISCORD_ACCOUNT_WEBHOOK_URL }}
          DISCORD_PAYMENT_WEBHOOK_URL: ${{ secrets.DISCORD_PAYMENT_WEBHOOK_URL }}
          GOLE_DISCORD_ALERTS_ENABLED: "true"
          # Billing Budget의 실제비용을 Pub/Sub에서 받아 GoLe 운영 Discord로 중계한다.
          # 계정 이동 시에는 아래 repository variables만 새 프로젝트/크레딧 기간으로 바꾼다.
          GCP_BUDGET_PUBSUB_SUBSCRIPTION: ${{ vars.GCP_BUDGET_PUBSUB_SUBSCRIPTION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_CREDIT_AMOUNT_KRW: ${{ vars.GCP_CREDIT_AMOUNT_KRW }}
          GCP_CREDIT_DEADLINE: ${{ vars.GCP_CREDIT_DEADLINE }}
          GCP_FIXED_HOURLY_COST_KRW: ${{ vars.GCP_FIXED_HOURLY_COST_KRW }}
          # Billing은 수시간 지연될 수 있으므로 호스트 시간·송신 바이트 기반의
          # 독립 상한을 10초마다 계산하고, 어느 정지선이든 먼저 도달하면 VM을 멈춘다.
          GCP_HARD_STOP_ENABLED: ${{ vars.GCP_HARD_STOP_ENABLED }}
          GCP_HARD_STOP_DRY_RUN: ${{ vars.GCP_HARD_STOP_DRY_RUN }}
          GCP_HARD_STOP_BILLING_COST_KRW: ${{ vars.GCP_HARD_STOP_BILLING_COST_KRW }}
          GCP_HARD_STOP_MIN_RESERVE_KRW: ${{ vars.GCP_HARD_STOP_MIN_RESERVE_KRW }}
          GCP_HARD_STOP_ALL_IN_COST_KRW: ${{ vars.GCP_HARD_STOP_ALL_IN_COST_KRW }}
          GCP_COST_GUARD_WARNING_KRW: ${{ vars.GCP_COST_GUARD_WARNING_KRW }}
          GCP_COST_GUARD_DANGER_KRW: ${{ vars.GCP_COST_GUARD_DANGER_KRW }}
          GCP_HARD_STOP_NETWORK_GIB: ${{ vars.GCP_HARD_STOP_NETWORK_GIB }}
          GCP_COST_GUARD_NETWORK_WARNING_GIB: ${{ vars.GCP_COST_GUARD_NETWORK_WARNING_GIB }}
          GCP_COST_GUARD_NETWORK_DANGER_GIB: ${{ vars.GCP_COST_GUARD_NETWORK_DANGER_GIB }}
          GCP_HARD_STOP_MAX_RUNTIME_HOURS: ${{ vars.GCP_HARD_STOP_MAX_RUNTIME_HOURS }}
          GCP_COST_GUARD_RUNTIME_WARNING_HOURS: ${{ vars.GCP_COST_GUARD_RUNTIME_WARNING_HOURS }}
          GCP_COST_GUARD_RUNTIME_DANGER_HOURS: ${{ vars.GCP_COST_GUARD_RUNTIME_DANGER_HOURS }}
          GCP_HARD_STOP_EXPECTED_BUDGET_KRW: ${{ vars.GCP_HARD_STOP_EXPECTED_BUDGET_KRW }}
          GCP_HARD_STOP_BUDGET_ID: ${{ vars.GCP_HARD_STOP_BUDGET_ID }}
          GCP_HARD_STOP_BILLING_ACCOUNT_ID: ${{ vars.GCP_HARD_STOP_BILLING_ACCOUNT_ID }}
          GCP_HARD_STOP_BUDGET_DISPLAY_NAME: ${{ vars.GCP_HARD_STOP_BUDGET_DISPLAY_NAME }}
          GCP_HARD_STOP_PERIOD_START: ${{ vars.GCP_HARD_STOP_PERIOD_START }}
          GCP_VM_COST_START: ${{ vars.GCP_VM_COST_START }}
          GCP_HARD_STOP_AT: ${{ vars.GCP_HARD_STOP_AT }}
          GCP_HARD_STOP_ARM_ID: ${{ vars.GCP_HARD_STOP_ARM_ID }}
          GCP_INSTANCE_ZONE: ${{ vars.GCP_INSTANCE_ZONE }}
          GCP_INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
          GCP_VAT_RATE: ${{ vars.GCP_VAT_RATE }}
          GCP_NETWORK_EGRESS_KRW_PER_GIB: ${{ vars.GCP_NETWORK_EGRESS_KRW_PER_GIB }}
          GCP_STOPPED_RESOURCE_HOURLY_COST_KRW: ${{ vars.GCP_STOPPED_RESOURCE_HOURLY_COST_KRW }}
          GCP_COST_GUARD_INTERVAL_SECONDS: ${{ vars.GCP_COST_GUARD_INTERVAL_SECONDS }}
          GCP_HARD_STOP_RETRY_SECONDS: ${{ vars.GCP_HARD_STOP_RETRY_SECONDS }}
          BUDGET_HTTP_TIMEOUT_SECONDS: ${{ vars.BUDGET_HTTP_TIMEOUT_SECONDS }}
          # 운영 런타임의 무음 여부를 배포 시점에 명시한다. 이 값을 넘기지 않으면
          # application.yml의 기본값(true)이 이겨서 ERROR 경보까지 푸시 없이 나간다.
          # 야간 검증 때만 repository variable을 true로 올리고, 평시에는 false다.
          DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'false' }}
          # SMTP/PortOne 운영 키가 아직 등록되지 않은 공개 검증 환경이다. 키 없이
          # production 가드를 우회하지 말고 staging으로 정직하게 표시한다.
          GOLE_ENVIRONMENT: staging
          # 공개 환경에는 데모 데이터를 절대 적재하지 않는다. 기본값도 false지만 배포 계약에
          # 명시해 설정 회귀를 막는다.
          GOLE_CATALOG_SEED: "false"
          GOLE_LISTING_SEED: "false"
          GOLE_PRICING_SEED: "false"
          GOLE_PRICING_INCLUDE_DEMO: "false"
          GOLE_PRICING_INCLUDE_LEGACY: "false"
          GOLE_COMMUNITY_SEED: "false"
          GOLE_REPORT_SEED: "false"
          GOLE_REVIEW_SEED: "false"
          # 번들 SVG는 classpath에서 직접 제공하므로 MinIO 시드 재업로드가 필요 없다.
          GOLE_MEDIA_SEED: "false"
          # NEXT_PUBLIC_*은 Next.js 빌드 타임에 번들로 인라인된다. 컨테이너가 재생성돼
          # .env.production이 없어져도 repository variables에서 매번 동일하게 주입한다.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PAYMENT_MODE: ${{ vars.NEXT_PUBLIC_PAYMENT_MODE }}
          NEXT_PUBLIC_PORTONE_STORE_ID: ${{ vars.NEXT_PUBLIC_PORTONE_STORE_ID }}
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${{ vars.NEXT_PUBLIC_PORTONE_CHANNEL_KEY }}
          NEXT_PUBLIC_PORTONE_CARD_CHANNEL_KEY: ${{ vars.NEXT_PUBLIC_PORTONE_CARD_CHANNEL_KEY }}
        run: bash /app/scripts/deploy.sh all

      # 첫 rollout은 실행 시작 시점의 이전 deploy.sh inode를 사용하므로, 새 파일로
      # 갱신된 뒤 workflow 자체에서도 watchdog을 멱등 설치한다.
      - name: Install fail-closed host watchdog
        id: watchdog
        run: |
          sudo install -m 0755 /app/infra/gcp/scripts/cost-guard-watchdog.sh \
            /usr/local/sbin/gole-cost-guard-watchdog
          sudo install -m 0644 /app/infra/gcp/systemd/gole-cost-guard-watchdog.service \
            /etc/systemd/system/gole-cost-guard-watchdog.service
          sudo install -m 0644 /app/infra/gcp/systemd/gole-cost-guard-watchdog.timer \
            /etc/systemd/system/gole-cost-guard-watchdog.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now gole-cost-guard-watchdog.timer

      - name: Verify production readiness
        id: readiness
        run: curl -fsS --max-time 15 http://127.0.0.1:8080/actuator/health/readiness

      # deploy.sh가 실패했다면 그쪽에서 이미 실패 알림을 한 건 보냈다. 여기서 또 보내지
      # 않도록 "배포는 성공했는데 공개 readiness가 죽은" 경우로만 좁힌다. 배포 실패 알림은
      # 어느 경로로 실패하든 실행당 정확히 한 건이어야 한다.
      - name: Notify post-deploy readiness failure
        if: ${{ failure() && steps.readiness.outcome == 'failure' }}
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
          DISCORD_AVATAR_URL: https://gole.co.kr/icon.svg
          DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'false' }}
        run: |
          webhook_url="${DISCORD_DEPLOY_WEBHOOK_URL:-${DISCORD_OPERATIONS_WEBHOOK_URL:-}}"
          if [ -z "$webhook_url" ]; then
            echo "배포 webhook 미설정 — 알림을 건너뛴다"
            exit 0
          fi
          flags=""
          if [ "$DISCORD_SUPPRESS_NOTIFICATIONS" = "true" ]; then
            flags=',"flags":4096'
          fi
          # self-hosted 러너에 jq가 있다고 가정하지 않는다(deploy.sh와 같은 이유).
          # content는 전부 우리가 만든 값이라 JSON 이스케이프가 필요한 문자가 없다.
          content="❌ GoLe 배포 후 readiness 검증 실패 · gole.co.kr · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --max-time 10 \
            -H 'Content-Type: application/json' \
            --data "{\"content\":\"${content}\",\"avatar_url\":\"${DISCORD_AVATAR_URL}\",\"allowed_mentions\":{\"parse\":[]}${flags}}" \
            "$webhook_url" >/dev/null

      - name: Fail closed when deployment or watchdog installation failed
        if: >-
          ${{ failure() &&
              (steps.deploy.outcome == 'failure' || steps.watchdog.outcome == 'failure') }}
        run: sudo systemctl poweroff --no-block
