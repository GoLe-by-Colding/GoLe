name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# 운영 컨테이너에서는 한 번에 하나의 배포만 실행한다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ubuntu-gole
    # PR용 CI 완료 이벤트는 배포하지 않고, main push의 성공한 CI만 배포한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Linux, ARM64, gole-production]
    timeout-minutes: 30
    steps:
      - name: Deploy latest main
        run: bash /app/scripts/deploy.sh all

      - name: Verify production readiness
        run: curl -fsS --max-time 15 https://gole.kscold.com/actuator/health/readiness
