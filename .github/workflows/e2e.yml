name: E2E (live UI smoke)

# 배포 사이트 대상 읽기전용 UI/UX 스모크. 쓰기 플로우(purchase/create-listing)는 E2E_BASE_URL 설정 시 자동 skip.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST

jobs:
  e2e:
    name: Playwright (desktop + mobile) vs gole.kscold.com
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://gole.kscold.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test
        continue-on-error: true

      # 리포트를 GitHub Actions 아티팩트로 보존
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      # 리포트를 라이브 서버(/test-report/)에 배포
      - name: Deploy report to gole.kscold.com/test-report/
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2223 kscold.iptime.org >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete -e "ssh -p 2223 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            apps/web/playwright-report/ \
            root@kscold.iptime.org:/Users/kscold/Desktop/bucket/playwright-report/
        continue-on-error: true
