name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 동일 ref의 이전 실행은 취소(최신만 유지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  web:
    name: Frontend (lint · format · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm --filter web format:check

      - name: ESLint (boundaries)
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: FSD lint (steiger)
        run: pnpm --filter web fsd:lint

      - name: Build
        run: pnpm --filter web build

  api:
    name: Backend (spotless · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          # auto-fix 커밋을 push하려면 fetch-depth 0이 필요
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check (auto-fix on failure)
        run: |
          if ! ./gradlew spotlessCheck --no-daemon; then
            ./gradlew spotlessApply --no-daemon
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --staged --quiet || git commit -m "style(backend): CI auto spotless fix"
            git push
            echo "Spotless violations fixed and pushed. Re-running check..."
            ./gradlew spotlessCheck --no-daemon
          fi

      - name: Test & build
        run: ./gradlew build --no-daemon

  notify:
    name: Discord CI result
    if: ${{ always() && github.event_name == 'push' }}
    needs: [web, api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
      WEB_RESULT: ${{ needs.web.result }}
      API_RESULT: ${{ needs.api.result }}
    steps:
      - name: Notify GoLe operations channel
        if: ${{ env.DISCORD_CI_WEBHOOK_URL != '' }}
        run: |
          if [ "$WEB_RESULT" = success ] && [ "$API_RESULT" = success ]; then
            status="✅ CI 통과"
          else
            status="❌ CI 실패"
          fi
          payload=$(jq -n \
            --arg content "$status · web=$WEB_RESULT · api=$API_RESULT · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{content: $content, allowed_mentions: {parse: []}}')
          curl -fsS --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_CI_WEBHOOK_URL"
