name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 동일 ref의 이전 실행은 취소(최신만 유지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  web:
    name: Frontend (lint · format · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm --filter web format:check

      - name: ESLint (boundaries)
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: FSD lint (steiger)
        run: pnpm --filter web fsd:lint

      - name: Build
        run: pnpm --filter web build

  api:
    name: Backend (spotless · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          # auto-fix 커밋을 push하려면 fetch-depth 0이 필요
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check (auto-fix on failure)
        run: |
          if ! ./gradlew spotlessCheck --no-daemon; then
            ./gradlew spotlessApply --no-daemon
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --staged --quiet || git commit -m "style(backend): CI auto spotless fix"
            git push
            echo "Spotless violations fixed and pushed. Re-running check..."
            ./gradlew spotlessCheck --no-daemon
          fi

      - name: Test & build
        run: ./gradlew build --no-daemon

      # build의 test는 *IntegrationTest를 제외한다(로컬에 Docker가 없을 수 있으므로).
      # CI 러너에는 Docker가 있으므로 여기서 Testcontainers 테스트를 실제로 돌린다.
      # 이 스텝이 없으면 단일 낙찰·exactly-once 정산 검증이 아무 데서도 실행되지 않는다.
      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest --no-daemon

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # 구매 플로우 E2E는 주문·결제·정산을 실제로 거치므로 백엔드와 저장소가 필요하다.
      # mongo-init: replica set 초기화 — 없으면 멀티 도큐먼트 트랜잭션이 실패한다.
      # minio-init: 버킷 공개 읽기 정책 — 앱이 버킷은 만들지만 정책은 설정하지 않으므로,
      #             이게 없으면 브라우저가 매물 이미지를 못 받아 이미지 단정이 실패한다.
      - name: Start infra (Mongo rs0 · Redis · MinIO)
        run: |
          docker compose up -d --wait mongo redis minio
          docker compose run --rm --no-deps mongo-init
          docker compose run --rm --no-deps minio-init

      - name: Build API jar
        working-directory: apps/api
        run: ./gradlew bootJar --no-daemon -x test

      - name: Start API
        working-directory: apps/api
        env:
          # 앱이 러너 호스트에서 직접 뜨므로 컨테이너 전용 호스트명을 쓰면 안 된다.
          STORAGE_S3_ENDPOINT: http://localhost:9000
          STORAGE_PUBLIC_BASE_URL: http://localhost:9000/gole
          # spring.mail.host가 정의되어 있으면 Spring이 MailHealthIndicator를 자동 등록하고,
          # SMTP가 없는 환경에서는 그 지표 하나가 /actuator/health 전체를 DOWN(503)으로 만든다.
          # CI에는 SMTP를 붙이지 않으므로 이 지표를 끈다. Mongo·Redis 확인은 그대로 남는다.
          MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
        run: |
          nohup java -jar build/libs/*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API failed to start"
          # 어느 지표가 DOWN인지 바로 보이게 남긴다. 로그만 있으면 원인 찾기가 훨씬 느리다.
          echo "--- /actuator/health ---"
          curl -sS http://localhost:8080/actuator/health || echo "(응답 없음)"
          echo "--- api.log ---"
          tail -100 "$RUNNER_TEMP/api.log"
          exit 1

      # E2E_WITH_BACKEND: 관리자 API 가드 테스트는 이 값이 없으면 조용히 스킵된다.
      # 백엔드가 실제로 떠 있는 이 잡이 그 테스트를 돌릴 수 있는 유일한 곳이다.
      - name: E2E
        env:
          E2E_WITH_BACKEND: "1"
        run: pnpm --filter web e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: API log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log"

  notify:
    name: Discord CI result
    if: ${{ always() && github.event_name == 'push' }}
    needs: [web, api, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
      DISCORD_AVATAR_URL: https://gole.kscold.com/icon.svg
      DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'true' }}
      WEB_RESULT: ${{ needs.web.result }}
      API_RESULT: ${{ needs.api.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Notify GoLe operations channel
        if: ${{ env.DISCORD_CI_WEBHOOK_URL != '' }}
        run: |
          if [ "$WEB_RESULT" = success ] && [ "$API_RESULT" = success ] && [ "$E2E_RESULT" = success ]; then
            status="✅ CI 통과"
          else
            status="❌ CI 실패"
          fi
          if [ "$DISCORD_SUPPRESS_NOTIFICATIONS" = "true" ]; then
            flags=4096
          else
            flags=null
          fi
          payload=$(jq -n \
            --arg content "$status · web=$WEB_RESULT · api=$API_RESULT · e2e=$E2E_RESULT · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg avatar_url "$DISCORD_AVATAR_URL" \
            --argjson flags "$flags" \
            '{content: $content, avatar_url: $avatar_url, allowed_mentions: {parse: []}}
             + (if $flags == null then {} else {flags: $flags} end)')
          curl -fsS --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_CI_WEBHOOK_URL"
