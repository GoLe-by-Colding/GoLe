name: 릴리스 후 dev 동기화

# main 은 선형 이력을 강제받아 릴리스가 항상 squash 된다. squash 는 새 커밋을 만들므로
# main 과 dev 의 공통 조상이 끊기고, 그대로 두면 다음 릴리스 PR 이 전부 add/add 충돌로 보인다.
# 그래서 릴리스마다 main 을 dev 로 되돌려 붙여야 한다 — 그 일을 사람이 기억하지 않게 한다.
#
# 오늘(2026-09-12)부터 모든 PR 이 dev 를 거치므로 main 에는 고유 작업이 없다.
# 따라서 이 병합은 기계적이다. 그래도 충돌이 나면 **자동으로 풀지 않고 멈춘다** —
# 잘못 푼 역병합은 CI 를 통과하면서 코드를 조용히 되돌릴 수 있다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    name: main 을 dev 에 역병합
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev

      - name: 병합 시도
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ahead="$(git rev-list --count dev..origin/main)"
          if [ "$ahead" -eq 0 ]; then
            echo "main 에 dev 로 가져올 것이 없다 — 건너뛴다."
            echo "result=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "main 에만 있는 커밋 ${ahead}건"

          title="$(git log -1 --format='%s' origin/main)"
          if git merge --no-ff origin/main \
               -m "chore(sync): 릴리스 이후 main 을 dev 에 역병합함" \
               -m "- 대상: ${title}" \
               -m "- main 에만 있던 커밋 ${ahead}건을 dev 의 조상으로 편입함" \
               -m "- 검증: sync-dev.yml 이 충돌 없이 병합하고 트리가 origin/main 과 동일함을 확인함"
          then
            # squash 때문에 이력만 갈라졌을 뿐 내용은 같아야 한다. 다르면 뭔가 잘못된 것이다.
            if ! git diff --quiet origin/main HEAD -- . ':(exclude).github/workflows/sync-dev.yml'; then
              echo "::notice::병합 후 트리가 main 과 다르다 — dev 에만 있는 변경이 있다는 뜻이다(정상일 수 있음)."
              git diff --stat origin/main HEAD | tail -5
            fi
            git push origin dev
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: 충돌이면 사람을 부른다
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # 자동으로 풀지 않는다. 잘못 푼 역병합은 CI 를 통과하면서 코드를 조용히 되돌린다.
          # 아래 본문의 백틱은 마크다운 코드 표기이지 명령 치환이 아니다.
          # shellcheck disable=SC2016
          {
            printf '`sync-dev.yml` 이 `main` 을 `dev` 에 역병합하려다 충돌로 멈췄다.\n'
            printf '**자동으로 풀지 않는다** — 잘못 푼 역병합은 CI 를 통과하면서 코드를 조용히 되돌릴 수 있다.\n\n'
            printf '손으로 처리한다:\n\n'
            printf '```bash\n'
            printf 'git switch dev && git pull\n'
            printf 'git merge --no-ff origin/main\n'
            printf '# 충돌 해결 후\n'
            printf 'git commit && git push origin dev\n'
            printf '```\n\n'
            printf '충돌이 **두 번 연속** 나면 설계 문제다. `main` 의 `required_linear_history` 를 끄고\n'
            printf '`dev -> main` 을 merge commit 으로 받는 쪽을 검토한다 — 볼트\n'
            printf '`02_아키텍처/03_인프라/Git 흐름과 릴리스 규약` 의 "연혁" 참고.\n\n'
            printf '실행 로그: %s\n' "$RUN_URL"
          } > issue.md
          gh issue create --title "역병합 충돌: main 을 dev 에 붙이지 못했다" --label "설정" --body-file issue.md
          exit 1
