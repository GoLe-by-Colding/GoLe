name: Production health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    name: gole.co.kr readiness
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: https://gole.co.kr/actuator/health/readiness
      DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
      DISCORD_AVATAR_URL: https://gole.co.kr/icon.svg
      DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'true' }}
    steps:
      - name: Check production API
        id: check
        continue-on-error: true
        run: curl -fsS --max-time 10 --retry 2 --retry-delay 2 "$HEALTH_URL"

      - name: Notify outage
        if: ${{ steps.check.outcome == 'failure' && env.DISCORD_OPERATIONS_WEBHOOK_URL != '' }}
        run: |
          if [ "$DISCORD_SUPPRESS_NOTIFICATIONS" = "true" ]; then
            flags=4096
          else
            flags=null
          fi
          payload=$(jq -n \
            --arg content "🚨 GoLe 운영 API 응답 실패 · $HEALTH_URL · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg avatar_url "$DISCORD_AVATAR_URL" \
            --argjson flags "$flags" \
            '{content: $content, avatar_url: $avatar_url, allowed_mentions: {parse: []}}
             + (if $flags == null then {} else {flags: $flags} end)')
          curl -fsS --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_OPERATIONS_WEBHOOK_URL"

      - name: Fail workflow when unhealthy
        if: ${{ steps.check.outcome == 'failure' }}
        run: exit 1
