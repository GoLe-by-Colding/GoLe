name: Secret Sync
run-name: GoLe secret sync · ${{ inputs.request_id }} · v${{ inputs.secret_version }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fixed deployment target
        required: true
        type: choice
        options:
          - gole-production
      secret_version:
        description: Exact Secret Manager version
        required: true
        type: string
      request_id:
        description: Control deployment request UUID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply exact environment version
    # Secret Sync도 운영 배포다. default branch가 아닌 ref에서 실행하거나 다른 대상을
    # 입력한 요청은 self-hosted runner에 닿기 전에 거부한다.
    if: >-
      vars.GOLE_PRODUCTION_HOST_READY == 'true' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'gole-production'
    runs-on: [self-hosted, Linux, X64, gole-gcp-production]
    timeout-minutes: 30
    env:
      SECRET_SYNC_TARGET: ${{ inputs.target }}
      SECRET_SYNC_VERSION: ${{ inputs.secret_version }}
      SECRET_SYNC_REQUEST_ID: ${{ inputs.request_id }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
      DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
      DISCORD_ACCOUNT_WEBHOOK_URL: ${{ secrets.DISCORD_ACCOUNT_WEBHOOK_URL }}
      DISCORD_PAYMENT_WEBHOOK_URL: ${{ secrets.DISCORD_PAYMENT_WEBHOOK_URL }}
      DISCORD_SUPPORT_WEBHOOK_URL: ${{ secrets.DISCORD_SUPPORT_WEBHOOK_URL }}
      DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'false' }}
      # 운영 정책·PortOne·GA/GTM은 runner 환경을 신뢰하지 않는다. root helper가
      # Secret Manager의 exact version을 root-owned 후보로 받아 validator를 통과시킨다.
    steps:
      - name: Install root-owned Discord routing overlay
        run: |
          set -Eeuo pipefail
          required=(
            DISCORD_OPERATIONS_WEBHOOK_URL
            DISCORD_ACCOUNT_WEBHOOK_URL
            DISCORD_PAYMENT_WEBHOOK_URL
          )
          for variable_name in "${required[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "필수 Discord GitHub secret 누락: ${variable_name}" >&2
              exit 1
            fi
          done
          operations="$DISCORD_OPERATIONS_WEBHOOK_URL"
          deploy="${DISCORD_DEPLOY_WEBHOOK_URL:-$operations}"
          support="${DISCORD_SUPPORT_WEBHOOK_URL:-$operations}"
          [[ "$DISCORD_SUPPRESS_NOTIFICATIONS" =~ ^(true|false)$ ]] || {
            echo "Discord suppress 설정은 true 또는 false여야 합니다." >&2
            exit 1
          }
          set +x
          printf '%s\n' \
            'GOLE_DISCORD_ALERTS_ENABLED=true' \
            "DISCORD_DEPLOY_WEBHOOK_URL=$deploy" \
            "DISCORD_OPERATIONS_WEBHOOK_URL=$operations" \
            "DISCORD_ACCOUNT_WEBHOOK_URL=$DISCORD_ACCOUNT_WEBHOOK_URL" \
            "DISCORD_PAYMENT_WEBHOOK_URL=$DISCORD_PAYMENT_WEBHOOK_URL" \
            "DISCORD_SUPPORT_WEBHOOK_URL=$support" \
            "DISCORD_SUPPRESS_NOTIFICATIONS=$DISCORD_SUPPRESS_NOTIFICATIONS" |
            sudo -n /usr/local/sbin/gole-hostctl discord-overlay-install

      - name: Apply and verify Secret Manager version
        run: |
          set -Eeuo pipefail
          cd /app
          if [ ! -f /run/lock/gole-production-rollout.lock ] ||
            [ -L /run/lock/gole-production-rollout.lock ]; then
            echo "운영 rollout lock이 설치되지 않았습니다." >&2
            exit 1
          fi
          exec 7>>/run/lock/gole-production-rollout.lock
          flock -n 7 || {
            echo "다른 운영 배포 또는 환경 동기화가 진행 중입니다." >&2
            exit 1
          }
          # Secret 변경은 새 main 코드를 앞질러 배포하지 않는다. root marker가 가리키는
          # 마지막 정상 배포 SHA의 validator/Compose/deploy 코드만 사용한다.
          deployed_sha="$(sudo -n /usr/local/sbin/gole-hostctl deployment-read-sha)"
          restore_checkout_on_failure() {
            status=$?
            if [ "$status" -ne 0 ] && [ -n "${deployed_sha:-}" ]; then
              git reset --hard "$deployed_sha" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap restore_checkout_on_failure EXIT
          git fetch --prune origin main
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "운영 checkout에 커밋되지 않은 변경이 있어 Secret Sync를 중단한다" >&2
            git status --short >&2
            exit 1
          fi
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "마지막 정상 배포 SHA marker가 올바르지 않습니다." >&2
            exit 1
          fi
          git cat-file -e "${deployed_sha}^{commit}"
          git reset --hard "$deployed_sha"
          GOLE_ROLLOUT_LOCK_HELD=1 \
            bash /app/infra/gcp/scripts/apply-secret-env.sh \
            "$SECRET_SYNC_TARGET" \
            "$SECRET_SYNC_VERSION" \
            "$SECRET_SYNC_REQUEST_ID"
          trap - EXIT
