name: Secret Sync
run-name: GoLe secret sync · ${{ inputs.request_id }} · v${{ inputs.secret_version }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fixed deployment target
        required: true
        type: string
      secret_version:
        description: Exact Secret Manager version
        required: true
        type: string
      request_id:
        description: Control deployment request UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply exact environment version
    runs-on: [self-hosted, Linux, X64, gole-gcp-production]
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GOLE_SECRET_NAME: gole-production-env
      SECRET_SYNC_TARGET: ${{ inputs.target }}
      SECRET_SYNC_VERSION: ${{ inputs.secret_version }}
      SECRET_SYNC_REQUEST_ID: ${{ inputs.request_id }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
      DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
      DISCORD_ACCOUNT_WEBHOOK_URL: ${{ secrets.DISCORD_ACCOUNT_WEBHOOK_URL }}
      DISCORD_PAYMENT_WEBHOOK_URL: ${{ secrets.DISCORD_PAYMENT_WEBHOOK_URL }}
      DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'false' }}
      GOLE_DISCORD_ALERTS_ENABLED: "true"
    steps:
      - name: Apply and verify Secret Manager version
        run: |
          bash /app/infra/gcp/scripts/apply-secret-env.sh \
            "$SECRET_SYNC_TARGET" \
            "$SECRET_SYNC_VERSION" \
            "$SECRET_SYNC_REQUEST_ID"
