# Playwright 쓰기 플로우 전용 프로필. 로컬 개발 데이터와 컬렉션·미디어를 공유하지 않는다.
spring:
  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://localhost:${MONGODB_PORT:27017}/gole_e2e?replicaSet=rs0}"
      database: "${MONGODB_DATABASE:gole_e2e}"
    redis:
      # 사용자 개발 세션(DB 0)과 E2E 고정 세션을 분리한다. Redis 자체를 공유하더라도
      # 테스트 토큰이 실제 로그인 세션 공간에 섞이지 않는다.
      database: ${REDIS_DATABASE:15}

storage:
  s3:
    bucket: ${STORAGE_S3_BUCKET:gole-e2e}

# e2e 프로필은 전용 Mongo/Redis/버킷만 사용하므로 화면 탐색용 샘플을 명시적으로 허용한다.
# 기본 프로필과 공개 staging은 모두 false라 실제 데이터에 섞이지 않는다.
gole:
  catalog:
    seed-on-empty: true
  listing:
    seed-on-empty: true
  pricing:
    seed-on-empty: true
  community:
    seed-on-empty: true
  report:
    seed-on-empty: true
  review:
    seed-on-empty: true
  media:
    seed-on-startup: true
