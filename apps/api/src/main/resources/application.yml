spring:
  application:
    name: gole-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gole?replicaSet=rs0}
      database: ${MONGODB_DATABASE:gole}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.gole.api: DEBUG

# 시드 데이터: 각 컬렉션이 비어 있을 때만 1회 적재(멱등). 테스트에서는 false로 비활성화한다.
gole:
  catalog:
    seed-on-empty: ${GOLE_CATALOG_SEED:true}
  listing:
    seed-on-empty: ${GOLE_LISTING_SEED:true}
  pricing:
    seed-on-empty: ${GOLE_PRICING_SEED:true}
  community:
    seed-on-empty: ${GOLE_COMMUNITY_SEED:true}
