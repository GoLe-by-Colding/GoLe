spring:
  application:
    name: gole-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gole?replicaSet=rs0}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.gole.api: DEBUG
