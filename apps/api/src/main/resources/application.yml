spring:
  application:
    name: gole-api
  # API 규약은 enum을 소문자 키로 주고받는다(`condition: "like_new"`, `completeness: "full_box"`).
  # Jackson 기본값은 대소문자를 가려서 프론트가 보내는 값 그대로면 역직렬화가 실패한다.
  # 응답은 계속 소문자로 나가므로(ListingResponse.from) 이 설정이 있어야 왕복이 맞는다.
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gole?replicaSet=rs0}
      database: ${MONGODB_DATABASE:gole}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_IMAGE_BYTES:5242880}
      max-request-size: ${STORAGE_MAX_REQUEST_BYTES:55000000}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

storage:
  s3:
    # 기본 개발 실행은 호스트 JVM이므로 localhost를 사용한다. 컨테이너 실행 시에는
    # STORAGE_S3_ENDPOINT=http://minio:9000처럼 배포 환경에서 명시한다.
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_S3_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
    region: ${STORAGE_S3_REGION:us-east-1}
    bucket: ${STORAGE_S3_BUCKET:gole}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://gole.co.kr}
  max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:5242880}

# 소셜 로그인(OAuth2). client-id/secret만 env로 주입하면 활성화된다(미설정 provider는 비활성).
oauth:
  providers:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${GOOGLE_OAUTH_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${GOOGLE_OAUTH_USERINFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
      scope: ${GOOGLE_OAUTH_SCOPE:openid email profile}
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${KAKAO_OAUTH_AUTH_URI:https://kauth.kakao.com/oauth/authorize}
      token-uri: ${KAKAO_OAUTH_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_OAUTH_USERINFO_URI:https://kapi.kakao.com/v2/user/me}
      scope: ${KAKAO_OAUTH_SCOPE:account_email}
    naver:
      client-id: ${NAVER_OAUTH_CLIENT_ID:}
      client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${NAVER_OAUTH_AUTH_URI:https://nid.naver.com/oauth2.0/authorize}
      token-uri: ${NAVER_OAUTH_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
      user-info-uri: ${NAVER_OAUTH_USERINFO_URI:https://openapi.naver.com/v1/nid/me}
      scope: ${NAVER_OAUTH_SCOPE:}

server:
  port: ${SERVER_PORT:8080}
  # 프록시에서 조용히 버리지 않고 애플리케이션이 제한·로그를 소유한다.
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:32768}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        # 운영 기본값은 로드밸런서 헬스체크만 공개한다. 추가 엔드포인트는 명시적으로 환경변수에 지정한다.
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 서비스 readiness는 핵심 데이터 경로(Mongo/Redis)를 뜻한다. MinIO 장애는
        # 전체 health에는 DOWN으로 남지만 번들 미디어 fallback이 있으므로 사이트
        # 전체를 내리지 않고 업로드 요청만 명확한 503으로 처리한다.
        readiness:
          include: readinessState,mongo,redis
  health:
    mail:
      # spring.mail.host 를 정의하는 순간 Spring이 MailHealthIndicator를 자동 등록한다.
      # SMTP_HOST 미설정 시 기본값은 localhost:587이고 그 자리에 SMTP 서버는 없다.
      # 그러면 메일 인증(gole.verification.email.enabled)이 꺼져 있는 기본 구성에서도
      # /actuator/health 전체가 DOWN(503)이 되고, deploy.sh의 헬스 게이트가 정상 배포를
      # 실패로 처리한다. 실제로 쓰는 SMTP를 붙일 때만 이 지표를 켠다.
      enabled: ${GOLE_MAIL_HEALTH_ENABLED:false}

logging:
  level:
    com.gole.api: ${GOLE_LOG_LEVEL:INFO}

# 시드 데이터: 기본은 전부 꺼져 있다. 로컬 데모에서만 명시적으로 켠다.
gole:
  environment: ${GOLE_ENVIRONMENT:local}
  # 가입 당시의 정책 버전을 별도 append-only 이력으로 남긴다. 약관/처리방침을 바꾸면
  # 문서의 시행일과 이 값을 함께 올려 오래된 가입 화면의 제출을 fail-closed 한다.
  policy:
    terms-version: ${GOLE_TERMS_VERSION:2026-09-03}
    privacy-version: ${GOLE_PRIVACY_VERSION:2026-09-03}
    minimum-age: ${GOLE_MINIMUM_SIGNUP_AGE:14}
  catalog:
    seed-on-empty: ${GOLE_CATALOG_SEED:false}
  listing:
    seed-on-empty: ${GOLE_LISTING_SEED:false}
  pricing:
    seed-on-empty: ${GOLE_PRICING_SEED:false}
    evidence:
      # 공개 환경의 시장 통계는 플랫폼 결제 증빙만 포함한다. 데모·출처 미확인 문서는
      # 로컬 개발에서 명시적으로 허용할 때만 읽는다.
      include-demo: ${GOLE_PRICING_INCLUDE_DEMO:false}
      include-legacy: ${GOLE_PRICING_INCLUDE_LEGACY:false}
  community:
    seed-on-empty: ${GOLE_COMMUNITY_SEED:false}
  report:
    seed-on-empty: ${GOLE_REPORT_SEED:false}
  review:
    seed-on-empty: ${GOLE_REVIEW_SEED:false}
  media:
    seed-on-startup: ${GOLE_MEDIA_SEED:false}
    upload-rate-limit:
      maximum-images: ${GOLE_MEDIA_UPLOAD_RATE_MAX_IMAGES:30}
      window: ${GOLE_MEDIA_UPLOAD_RATE_WINDOW:PT10M}
  # 파이프라인 상태별 타임아웃(shipping-and-fees R9.1). 코드 상수 금지 — 전부 여기서.
  # 정상 거래는 운영자 개입 0으로 끝까지 흘러가고, 예외만 큐에 올라온다(R7).
  pipeline:
    interval: ${GOLE_PIPELINE_INTERVAL:PT1M}
    payment-pending-expiry: ${GOLE_PIPELINE_PAYMENT_EXPIRY:PT30M}
    shipment-reminder-after: ${GOLE_PIPELINE_SHIPMENT_REMINDER:P3D}
    unshipped-refund-after: ${GOLE_PIPELINE_UNSHIPPED_REFUND:P7D}
    carrier-pickup-timeout: ${GOLE_PIPELINE_CARRIER_PICKUP_TIMEOUT:P3D}
    transit-stall-after: ${GOLE_PIPELINE_TRANSIT_STALL:P14D}
    auto-complete-after: ${GOLE_PIPELINE_AUTO_COMPLETE:P7D}
    dispute-escalation-after: ${GOLE_PIPELINE_DISPUTE_ESCALATION:P3D}
    tracker-unknown-after: ${GOLE_PIPELINE_TRACKER_UNKNOWN:PT24H}
  # 정산 실행 방식. MANUAL | PROVIDER | DISABLED
  #   MANUAL   계약된 지급대행을 운영자가 실행한 뒤 증빙을 어드민에서 확정(PAID).
  #   PROVIDER SettlementExecutionPort 구현체(PG 지급대행)가 자동 지급. 구현체가 없으면 부팅 실패.
  #   DISABLED 신규 결제·정산을 열지 않는 안전 기본값. 공개 단계는 Stage 1 이하로 잠긴다.
  # payout-contract-verified 는 현재 도메인·C2C 모델·판매자 유형의 서면 승인 확인값이다.
  # false이면 mode와 저장 stage가 높아도 실행 Stage 1 이하, 지급 실행 불가로 잠긴다.
  # mode 는 SettlementExecutor 가 부팅 시 검증한다 — 설정만 바꾸고 어댑터가 없으면 뜨지 않는다.
  #
  # payout-holdback: 구매확정(원장 적재) 후 실제 이체까지의 운영 완충 시간.
  # 구매확정 뒤 분쟁 접수 정책을 대신하지 않으므로 약관·PG 계약과 함께 검토한다.
  settlement:
    mode: ${GOLE_SETTLEMENT_MODE:DISABLED}
    payout-contract-verified: ${GOLE_SETTLEMENT_PAYOUT_CONTRACT_VERIFIED:false}
    payout-holdback: ${GOLE_SETTLEMENT_PAYOUT_HOLDBACK:P3D}
    provider-retry-after: ${GOLE_SETTLEMENT_PROVIDER_RETRY_AFTER:PT5M}
    provider-claim-timeout: ${GOLE_SETTLEMENT_PROVIDER_CLAIM_TIMEOUT:PT10M}
    provider-batch-size: ${GOLE_SETTLEMENT_PROVIDER_BATCH_SIZE:20}
    provider-max-attempts: ${GOLE_SETTLEMENT_PROVIDER_MAX_ATTEMPTS:5}
  # 플랫폼 수수료 정책(shipping-and-fees R5). 요율 변경이 배포 없이 가능해야 한다.
  # min/max 가 0이면 하한/상한 없음.
  fee:
    rate: ${GOLE_FEE_RATE:0.05}
    min-fee: ${GOLE_FEE_MIN:0}
    max-fee: ${GOLE_FEE_MAX:0}
  # 관리자 부트스트랩: 둘 다 설정되고 계정이 없을 때만 ADMIN 계정 1회 생성(멱등)
  admin:
    email: ${GOLE_ADMIN_EMAIL:}
    password: ${GOLE_ADMIN_PASSWORD:}
  verification:
    email:
      enabled: ${GOLE_VERIFICATION_EMAIL_ENABLED:false}
      from: ${GOLE_VERIFICATION_EMAIL_FROM:no-reply@gole.co.kr}
  session:
    cookie-secure: ${GOLE_SESSION_COOKIE_SECURE:auto}
    # 브라우저 쿠키 수명과 별개로 Redis에서 유휴·절대 만료를 함께 강제한다.
    absolute-ttl: ${GOLE_SESSION_ABSOLUTE_TTL:P7D}
    idle-ttl: ${GOLE_SESSION_IDLE_TTL:P1D}
    rotation-age: ${GOLE_SESSION_ROTATION_AGE:PT12H}
  # Discord 운영 관제. webhook URL은 저장소에 넣지 말고 배포 환경변수로만 주입한다.
  discord:
    enabled: ${GOLE_DISCORD_ALERTS_ENABLED:false}
    environment: ${GOLE_ENVIRONMENT:local}
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    account-webhook-url: ${DISCORD_ACCOUNT_WEBHOOK_URL:}
    payment-webhook-url: ${DISCORD_PAYMENT_WEBHOOK_URL:}
    operations-webhook-url: ${DISCORD_OPERATIONS_WEBHOOK_URL:}
    # 모든 역할별 웹훅 메시지 프로필을 GoLe 파비콘으로 통일한다. 필요하면 환경변수로 교체한다.
    avatar-url: ${DISCORD_AVATAR_URL:https://gole.co.kr/icon.svg}
    # 야간·초기 연동 중에는 Discord 메시지를 보내되 푸시 알림은 울리지 않는다.
    suppress-notifications: ${DISCORD_SUPPRESS_NOTIFICATIONS:true}
    # 같은 APPLICATION 장애는 요청 경로가 달라도 예외 종류별 한 건으로 묶어 알림 폭주를 막는다.
    deduplication-window: ${DISCORD_DEDUPLICATION_WINDOW:PT5M}

# 포트원(PortOne) V2 결제. 로컬은 스텁을 허용하지만 GOLE_ENVIRONMENT=production에서는
# enabled=true와 비밀키·상점·채널 설정이 모두 없으면 안전하게 부팅을 중단한다.
portone:
  enabled: ${PORTONE_ENABLED:false}
  api-base: ${PORTONE_API_BASE:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  # 카드(KG이니시스) 채널. 선택 설정 — 비우면 카드 결제가 열리지 않는다.
  # 카카오페이 채널 키와 같은 값이면 기동을 거부한다(한 채널로 두 수단이 승인되는 것을 막는다).
  card-channel-key: ${PORTONE_CARD_CHANNEL_KEY:}
  # TEST/LIVE는 모든 채널에 공통으로 적용한다.
  channel-type: ${PORTONE_CHANNEL_TYPE:TEST}
  reconciliation:
    minimum-age: ${PORTONE_RECONCILIATION_MINIMUM_AGE:PT10M}
    initial-delay: ${PORTONE_RECONCILIATION_INITIAL_DELAY:PT1M}
    interval: ${PORTONE_RECONCILIATION_INTERVAL:PT5M}

# 배송 트래커(Delivery Tracker, tracker.delivery). 기본은 스텁 — 자격증명을 주입해야 실 연동.
# 스텁은 등록 경과 시간으로 상태를 시뮬레이션한다(1분 후 이동중, 3분 후 배송완료).
shipping:
  tracker:
    enabled: ${SHIPPING_TRACKER_ENABLED:false}
    api-base: ${SHIPPING_TRACKER_API_BASE:https://apis.tracker.delivery/graphql}
    client-id: ${SHIPPING_TRACKER_CLIENT_ID:}
    client-secret: ${SHIPPING_TRACKER_CLIENT_SECRET:}
    poll-interval: ${SHIPPING_TRACKER_POLL_INTERVAL:PT1M}
    cache-ttl-active: ${SHIPPING_TRACKER_CACHE_TTL_ACTIVE:PT10M}
    cache-ttl-delivered: ${SHIPPING_TRACKER_CACHE_TTL_DELIVERED:PT24H}

# CoolSMS(SOLAPI) 카카오 알림톡. 활성화 시 키·시크릿·채널 연동 ID가 모두 필요하다.
coolsms:
  enabled: ${COOLSMS_ENABLED:false}
  api-key: ${COOLSMS_API_KEY:}
  api-secret: ${COOLSMS_API_SECRET:}
  pf-id: ${COOLSMS_PF_ID:}
