<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: #2f56e6;
    color: #ffffff;
    font-family: "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 96px 60px 72px;
  }
  h1 {
    margin-bottom: 56px;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.02em;
    word-break: keep-all;
  }
  .mark { width: 72px; height: 10px; background: #eab308; border-radius: 5px; margin-bottom: 36px; }
  /* 넓은 캡처는 원래 비율 그대로 아래쪽에 두고, 세로로 긴 캡처만 남는 칸에 맞춰 아래를 자른다. */
  .shot {
    margin-top: auto;
    flex: 0 1 auto;
    min-height: 0;
    width: 960px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(8, 20, 70, 0.35);
    background: #ffffff;
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  footer {
    margin-top: 48px;
    display: flex;
    justify-content: space-between;
    font-size: 30px;
    font-weight: 700;
    opacity: 0.92;
  }
</style>
</head>
<body>
  <div class="mark"></div>
  <h1>{{HEADLINE}}</h1>
  <div class="shot"><img src="{{IMAGE}}" alt=""></div>
  <footer><span>GoLe</span><span>gole.co.kr</span></footer>
</body>
</html>
