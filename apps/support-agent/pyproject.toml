[project]
name = "gole-support-agent"
version = "0.1.0"
description = "GoLe 문의 분류 및 관리자 답변 초안 gRPC 서비스"
requires-python = ">=3.13,<3.14"
dependencies = [
  "grpcio==1.83.1",
  "grpcio-health-checking==1.83.1",
  "grpcio-tools==1.83.1",
  "langgraph==1.2.11",
  "langchain-core==1.6.1",
  "langsmith==0.12.1",
  "openai>=2,<3",
  "pillow>=12,<13",
]

[project.optional-dependencies]
# 홍보 에이전트 전용. 운영에 상주하는 50051 이미지에는 들어가지 않는다(스펙 D10).
promotion = [
  "anthropic>=0.80,<1",
  "playwright>=1.49,<2",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src", "generated"]
testpaths = ["tests"]
addopts = "-q"
