[project]
name = "gole-support-agent"
version = "0.1.0"
description = "GoLe 문의 분류 및 관리자 답변 초안 gRPC 서비스"
requires-python = ">=3.13,<3.14"
dependencies = [
  "grpcio==1.83.1",
  "grpcio-health-checking==1.83.1",
  "grpcio-tools==1.83.1",
  "langgraph==1.2.11",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src", "generated"]
testpaths = ["tests"]
addopts = "-q"
